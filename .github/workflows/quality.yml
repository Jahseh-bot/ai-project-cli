name: CLI quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm pack
  templates:
    strategy:
      fail-fast: false
      matrix:
        template:
          [
            web-react,
            web-vue,
            api-node,
            fullstack-next,
            fullstack-nuxt,
            web-astro,
            "api-express:layered:sqlite:agent",
            "api-fastify:workspace:sqlite:rag",
            "fullstack-react:workspace:sqlite:chat",
          ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run smoke -- "${{ matrix.template }}"
